name: Fetch NTSB Accident Data

on:
  schedule:
    # Runs at 3 AM UTC on the 1st of every month
    - cron: '0 3 1 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch-ntsb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Fetch NTSB data
        run: node scripts/fetch-ntsb.js

      - name: Show generated SQL stats
        run: |
          echo "SQL file line count:"
          wc -l ntsb-import.sql

      - name: Import into D1
        run: |
          wrangler d1 execute DB --file=ntsb-import.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify import
        run: |
          wrangler d1 execute DB --command="SELECT COUNT(*) AS total FROM accidents;" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
