name: FAA Data Pipeline

on:
  schedule:
    # Weekly refresh: NTSB + FAA subset + ADs every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
    # Monthly full FAA registry refresh on the 1st at 04:00 UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      run_ntsb:
        description: 'Fetch + import NTSB data'
        type: boolean
        default: false
      run_subset:
        description: 'Fetch + import FAA subset'
        type: boolean
        default: false
      import_chunks:
        description: 'Full-FAA chunks to import (e.g. "1,2")'
        type: string
        default: ''
      run_ads:
        description: 'Fetch + import FAA Airworthiness Directives'
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine what to run
        id: determine
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "run_ntsb=${{ inputs.run_ntsb }}" >> $GITHUB_OUTPUT
            echo "run_subset=${{ inputs.run_subset }}" >> $GITHUB_OUTPUT
            echo "run_ads=${{ inputs.run_ads }}" >> $GITHUB_OUTPUT
            echo "import_chunks=${{ inputs.import_chunks }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" == "0 3 * * 0" ]; then
            echo "Running weekly refresh (NTSB + subset + ADs)"
            echo "run_ntsb=true" >> $GITHUB_OUTPUT
            echo "run_subset=true" >> $GITHUB_OUTPUT
            echo "run_ads=true" >> $GITHUB_OUTPUT
            echo "import_chunks=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" == "0 4 1 * *" ]; then
            echo "Running monthly full FAA registry refresh"
            echo "run_ntsb=false" >> $GITHUB_OUTPUT
            echo "run_subset=false" >> $GITHUB_OUTPUT
            echo "run_ads=false" >> $GITHUB_OUTPUT
            echo "import_chunks=1,2,3,4,5,6,7" >> $GITHUB_OUTPUT
          else
            echo "Unknown trigger — running nothing"
            echo "run_ntsb=false" >> $GITHUB_OUTPUT
            echo "run_subset=false" >> $GITHUB_OUTPUT
            echo "run_ads=false" >> $GITHUB_OUTPUT
            echo "import_chunks=" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Wrangler
        run: npm install -g wrangler

      # ============ NTSB ============
      - name: Fetch NTSB data
        if: ${{ steps.determine.outputs.run_ntsb == 'true' }}
        run: node scripts/fetch-ntsb.js

      - name: Import NTSB into D1
        if: ${{ steps.determine.outputs.run_ntsb == 'true' }}
        run: |
          for f in ntsb-import-part*.sql; do
            echo "Importing $f..."
            wrangler d1 execute DB --file="$f" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify NTSB import
        if: ${{ steps.determine.outputs.run_ntsb == 'true' }}
        run: wrangler d1 execute DB --command="SELECT COUNT(*) AS total FROM accidents;" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ============ FAA subset ============
      - name: Fetch FAA subset
        if: ${{ steps.determine.outputs.run_subset == 'true' }}
        run: node scripts/fetch-faa-subset.js

      - name: Import FAA subset into D1
        if: ${{ steps.determine.outputs.run_subset == 'true' }}
        run: wrangler d1 execute DB --file=faa-import.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ============ Full FAA (chunked) ============
      - name: Fetch full FAA registry
        if: ${{ steps.determine.outputs.import_chunks != '' }}
        run: node scripts/fetch-faa-full.js

      - name: Import FAA chunk 1
        if: ${{ contains(steps.determine.outputs.import_chunks, '1') }}
        run: wrangler d1 execute DB --file=faa-full-import-part1.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import FAA chunk 2
        if: ${{ contains(steps.determine.outputs.import_chunks, '2') }}
        run: wrangler d1 execute DB --file=faa-full-import-part2.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import FAA chunk 3
        if: ${{ contains(steps.determine.outputs.import_chunks, '3') }}
        run: wrangler d1 execute DB --file=faa-full-import-part3.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import FAA chunk 4
        if: ${{ contains(steps.determine.outputs.import_chunks, '4') }}
        run: wrangler d1 execute DB --file=faa-full-import-part4.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import FAA chunk 5
        if: ${{ contains(steps.determine.outputs.import_chunks, '5') }}
        run: wrangler d1 execute DB --file=faa-full-import-part5.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import FAA chunk 6
        if: ${{ contains(steps.determine.outputs.import_chunks, '6') }}
        run: wrangler d1 execute DB --file=faa-full-import-part6.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import FAA chunk 7
        if: ${{ contains(steps.determine.outputs.import_chunks, '7') }}
        run: wrangler d1 execute DB --file=faa-full-import-part7.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ============ Airworthiness Directives ============
      - name: Fetch FAA Airworthiness Directives
        if: ${{ steps.determine.outputs.run_ads == 'true' }}
        run: node scripts/fetch-ads.js

      - name: Import ADs into D1
        if: ${{ steps.determine.outputs.run_ads == 'true' }}
        run: wrangler d1 execute DB --file=ads-import.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify AD count
        if: ${{ steps.determine.outputs.run_ads == 'true' }}
        run: wrangler d1 execute DB --command="SELECT COUNT(*) AS total FROM directives;" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
