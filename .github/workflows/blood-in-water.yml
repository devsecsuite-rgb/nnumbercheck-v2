name: Blood in the Water SEO Scan

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight
  workflow_dispatch: # Allows you to run it manually

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the JSON output back to the repo
    
    # THIS IS THE FIX: It starts OpenSERP automatically on GitHub's servers
    services:
      openserp:
        image: karust/openserp:latest
        ports:
          - 7000:7000

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
        
      - name: Wait for OpenSERP to start
        run: sleep 10 # Give the Docker container 10 seconds to boot up
          
      - name: Run Scan
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          CRAWLY_API_KEY: ${{ secrets.CRAWLY_API_KEY }}
        run: python scripts/blood_in_water.py
        
      - name: Commit results
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/seo_opportunities.json
          git commit -m "Automated: Update SEO opportunities" || exit 0
          git push