name: Enrich Broker Listings

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to listings JSON'
        required: false
        default: 'scripts/controller_listings.json'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Move listings to scripts/
        run: |
          if [ -f "${{ github.event.inputs.input_file }}" ]; then
            cp "${{ github.event.inputs.input_file }}" scripts/controller_listings.json
          fi
          ls -la scripts/controller_listings.json

      - name: Enrich listings
        working-directory: scripts
        run: python enrich_listings.py

      - name: Generate broker emails
        working-directory: scripts
        run: python generate_broker_emails.py

      - name: Show summary
        working-directory: scripts
        run: |
          echo "=== Enrichment summary ==="
          python -c "
          import json
          d = json.load(open('controller_listings_enriched.json'))
          print(f'Total listings: {len(d)}')
          in_reg = sum(1 for x in d if x.get('in_registry'))
          with_ads = sum(1 for x in d if x.get('ads_applies', 0) and x['ads_applies'] > 0)
          with_acc = sum(1 for x in d if x.get('accidents', 0) and x['accidents'] > 0)
          print(f'In registry: {in_reg}')
          print(f'With applicable ADs: {with_ads}')
          print(f'With accidents: {with_acc}')
          "
          echo ""
          echo "=== First 30 lines of broker emails ==="
          head -50 broker_emails.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enriched-output
          path: |
            scripts/controller_listings_enriched.json
            scripts/broker_emails.md
          retention-days: 30
