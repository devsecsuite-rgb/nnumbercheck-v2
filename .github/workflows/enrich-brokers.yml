name: Enrich Broker Listings

on:
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest

    env:
      NNC_API_BASE: "https://nnumbercheck.com/api"
      NNC_API_DELAY: "1.0"
      NNC_SENDER_NAME: "Emiliano"
      NNC_SENDER_EMAIL: "support@nnumbercheck.com"
      NNC_SENDER_ADDRESS: "N.121 Thanon Ubon-Trakan UbonRatchathani Thailand"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify input file
        run: |
          ls -la scripts/controller_listings.json
          python -c "import json; d=json.load(open('scripts/controller_listings.json')); print(f'Input: {len(d)} listings')"

      - name: Run enrichment
        working-directory: scripts
        run: python enrich_listings.py

      - name: Generate broker emails
        working-directory: scripts
        run: python generate_broker_emails.py

      - name: Show summary
        working-directory: scripts
        run: |
          echo "=========================================="
          echo "=== Enrichment summary ==="
          echo "=========================================="
          python -c "
          import json
          d = json.load(open('controller_listings_enriched.json'))
          print(f'Total listings: {len(d)}')
          in_reg = sum(1 for x in d if x.get('in_registry'))
          with_ads = sum(1 for x in d if x.get('ads_applies') and x['ads_applies'] > 0)
          with_acc = sum(1 for x in d if x.get('accidents') and x['accidents'] > 0)
          print(f'In registry: {in_reg}')
          print(f'With applicable ADs: {with_ads}')
          print(f'With accidents: {with_acc}')
          "
          echo ""
          echo "=========================================="
          echo "=== First 60 lines of broker_emails.md ==="
          echo "=========================================="
          head -60 broker_emails.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enriched-output
          path: |
            scripts/controller_listings_enriched.json
            scripts/broker_emails.md
          retention-days: 30
